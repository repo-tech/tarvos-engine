[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvos"
version = "1.3.0.post2"
description = "Tarvos Engine public distribution for the Tarvos Python-to-native Rust compiler"
readme = "README.md"
authors = [{ name = "Repo-Tech Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = [
    "click>=8.1.0",           
    "pydantic>=2.0.0",        
    "python-dotenv>=1.0.0",   
    "rich>=13.7.0",           
    "psutil>=5.9.0"
]

[project.scripts]
tarvos = "tarvos.launcher:main"
