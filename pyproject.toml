# pyproject.toml file start

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvos"
version = "1.3.0"
description = "Tarvos Engine public distribution for the Tarvos Python-to-native Rust compiler"
readme = "README.md"
authors = [{ name = "Repo-Tech Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = [
    "flask>=3.0.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.28.0",
    "django>=5.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "polars>=0.20.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "click>=8.1.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
tarvos = "tarvos:main"

[tool.setuptools.packages.find]
include = ["tarvos*"]

    # --- 🧪 Testing & Code Quality (Tech Giants Dev-Ops) ---
    "pytest>=8.0.0",          # Industry standard for unit testing applications
    "ruff>=0.3.0"             # Extremely fast Python linter and formatter written in Rust

