# pyproject.toml file start

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvos"
version = "1.3.0"
description = "Tarvos Engine public distribution for the Tarvos Python-to-native Rust compiler"
readme = "README.md"
authors = [{ name = "Repo-Tech Team" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Compilers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.scripts]
tarvos = "tarvos:main"

[tool.setuptools.packages.find]
include = ["tarvos*"]

    # --- 🧪 Testing & Code Quality (Tech Giants Dev-Ops) ---
    "pytest>=8.0.0",          # Industry standard for unit testing applications
    "ruff>=0.3.0"             # Extremely fast Python linter and formatter written in Rust
